name: Apps Script Staging Admin Control

on:
  push:
    branches:
      - vnext
    paths:
      - '.github/workflows/apps-script-admin-control.yml'
      - 'config/apps-script-admin-deployment-id.txt'
      - 'scripts/call-apps-script-admin.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-control:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: career-os-staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve staging admin URL
        run: |
          deployment_id="$(tr -d '\r\n' < config/apps-script-admin-deployment-id.txt)"
          test -n "$deployment_id"
          echo "CAREER_OS_ADMIN_URL=https://script.google.com/macros/s/$deployment_id/exec" >> "$GITHUB_ENV"

      - name: Sync approved staging properties
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: setProperties
          CAREER_OS_ADMIN_PARAMS_JSON: >-
            {"values":{"CAREER_OS_AUDIO_TRANSCRIPTION_PROVIDER":"groq","CAREER_OS_AUDIO_PROXY_BASE_URL":"https://career-os-audio-proxy.s-haghi.workers.dev","CAREER_OS_STAGING_LIVE_PROVIDER_TEST":"ENABLED"}}
        run: node scripts/call-apps-script-admin.mjs

      - name: Check remote admin health
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: health
        run: node scripts/call-apps-script-admin.mjs

      - name: Run staging config probe
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: configProbe
        run: node scripts/call-apps-script-admin.mjs

      - name: Run staging proxy probe
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: proxyProbe
        run: node scripts/call-apps-script-admin.mjs

      - name: Ensure staging sources are queued
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: queueProbe
        run: node scripts/call-apps-script-admin.mjs

      - name: Run one staging worker execution
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: workerOnce
        run: node scripts/call-apps-script-admin.mjs

      - name: Verify staging root metadata
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: metadataProbe
        run: node scripts/call-apps-script-admin.mjs

      - name: Verify staging workspace artifacts
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: workspaceInventory
        run: node scripts/call-apps-script-admin.mjs
