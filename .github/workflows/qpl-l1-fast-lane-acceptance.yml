name: QPL L1 Fast-Lane Acceptance

on:
  push:
    branches:
      - vnext
    paths:
      - '.github/workflows/qpl-l1-fast-lane-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: career-os-staging
    outputs:
      started_epoch: ${{ steps.clock.outputs.started_epoch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve staging admin URL
        run: |
          deployment_id="$(tr -d '\r\n' < config/apps-script-admin-deployment-id.txt)"
          test -n "$deployment_id"
          echo "CAREER_OS_ADMIN_URL=https://script.google.com/macros/s/$deployment_id/exec" >> "$GITHUB_ENV"

      - name: Mark acceptance start
        id: clock
        run: echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Wait for fast-lane staging deployment
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: health
        run: |
          for i in $(seq 1 12); do
            if node scripts/call-apps-script-admin.mjs; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Publish root acceptance task
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: taskUpsert
          CAREER_OS_ADMIN_PARAMS_JSON: >-
            {"task":{"task_id":"acceptance:qpl-l1","title":"QPL L1 real fast-lane acceptance","executor":"github-actions","stage":"acceptance","status":"RUNNING","current_action":"Preparing real L1 ingestion and parallel fast lanes"}}
        run: node scripts/call-apps-script-admin.mjs

      - name: Publish ingest task
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: taskUpsert
          CAREER_OS_ADMIN_PARAMS_JSON: >-
            {"task":{"task_id":"acceptance:qpl-l1:ingest","parent_id":"acceptance:qpl-l1","title":"Ingest QPL L1 sources into staging queues","executor":"github-actions","stage":"ingestion","status":"RUNNING","current_action":"Consume private staging target and queue lecture sources"}}
        run: node scripts/call-apps-script-admin.mjs

      - name: Consume QPL L1 staging target
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: consumeStagingTarget
        run: node scripts/call-apps-script-admin.mjs

      - name: Ingest QPL L1 into queues
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: folderIngest
        run: node scripts/call-apps-script-admin.mjs

      - name: Finish ingest task
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: taskUpsert
          CAREER_OS_ADMIN_PARAMS_JSON: >-
            {"task":{"task_id":"acceptance:qpl-l1:ingest","parent_id":"acceptance:qpl-l1","title":"Ingest QPL L1 sources into staging queues","executor":"github-actions","stage":"ingestion","status":"DONE","current_action":"L1 sources queued","result_or_error":"Staging target consumed and folder ingest completed"}}
        run: node scripts/call-apps-script-admin.mjs

  image_lane:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      remaining: ${{ steps.image_run.outputs.remaining }}
    timeout-minutes: 8
    environment: career-os-staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve staging admin URL
        run: |
          deployment_id="$(tr -d '\r\n' < config/apps-script-admin-deployment-id.txt)"
          echo "CAREER_OS_ADMIN_URL=https://script.google.com/macros/s/$deployment_id/exec" >> "$GITHUB_ENV"

      - name: Publish image-lane task
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: taskUpsert
          CAREER_OS_ADMIN_PARAMS_JSON: >-
            {"task":{"task_id":"acceptance:qpl-l1:image","parent_id":"acceptance:qpl-l1","depends_on":["acceptance:qpl-l1:ingest"],"title":"Process QPL L1 image fast lane","executor":"apps-script:image","stage":"fast_lane:image","status":"RUNNING","current_action":"Process queued L1 images"}}
        run: node scripts/call-apps-script-admin.mjs

      - name: Run image fast lane once
        id: image_run
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: imageWorkerOnce
        run: |
          output="$(node scripts/call-apps-script-admin.mjs)"
          printf '%s\n' "$output"
          remaining="$(printf '%s' "$output" | node -e 'let s=""; process.stdin.on("data",d=>s+=d); process.stdin.on("end",()=>{const x=JSON.parse(s); console.log(Number(x.result.result.imageQueueRemaining||0));});')"
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"

      - name: Finish image-lane task
        if: success() && steps.image_run.outputs.remaining == '0'
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: taskUpsert
          CAREER_OS_ADMIN_PARAMS_JSON: >-
            {"task":{"task_id":"acceptance:qpl-l1:image","parent_id":"acceptance:qpl-l1","depends_on":["acceptance:qpl-l1:ingest"],"title":"Process QPL L1 image fast lane","executor":"apps-script:image","stage":"fast_lane:image","status":"DONE","current_action":"All queued L1 images completed","waiting_for":[],"result_or_error":"imageQueueRemaining=0"}}
        run: node scripts/call-apps-script-admin.mjs

      - name: Keep image-lane task waiting
        if: success() && steps.image_run.outputs.remaining != '0'
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: taskUpsert
          CAREER_OS_ADMIN_PARAMS_JSON: >-
            {"task":{"task_id":"acceptance:qpl-l1:image","parent_id":"acceptance:qpl-l1","depends_on":["acceptance:qpl-l1:ingest"],"title":"Process QPL L1 image fast lane","executor":"apps-script:image","stage":"fast_lane:image","status":"WAITING","current_action":"More L1 images remain queued","waiting_for":["next image worker invocation"],"result_or_error":"imageQueueRemaining=${{ steps.image_run.outputs.remaining }}"}}
        run: node scripts/call-apps-script-admin.mjs

      - name: Mark image-lane failure
        if: failure()
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: taskUpsert
          CAREER_OS_ADMIN_PARAMS_JSON: >-
            {"task":{"task_id":"acceptance:qpl-l1:image","parent_id":"acceptance:qpl-l1","title":"Process QPL L1 image fast lane","executor":"apps-script:image","stage":"fast_lane:image","status":"FAILED","current_action":"Image lane failed","result_or_error":"Inspect GitHub Actions logs"}}
        run: node scripts/call-apps-script-admin.mjs

  audio_lane:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      remaining: ${{ steps.audio_run.outputs.remaining }}
    timeout-minutes: 8
    environment: career-os-staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve staging admin URL
        run: |
          deployment_id="$(tr -d '\r\n' < config/apps-script-admin-deployment-id.txt)"
          echo "CAREER_OS_ADMIN_URL=https://script.google.com/macros/s/$deployment_id/exec" >> "$GITHUB_ENV"

      - name: Publish audio-lane task
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: taskUpsert
          CAREER_OS_ADMIN_PARAMS_JSON: >-
            {"task":{"task_id":"acceptance:qpl-l1:audio","parent_id":"acceptance:qpl-l1","depends_on":["acceptance:qpl-l1:ingest"],"title":"Process QPL L1 audio fast lane","executor":"apps-script:audio","stage":"fast_lane:audio","status":"RUNNING","current_action":"Transcribe queued L1 audio"}}
        run: node scripts/call-apps-script-admin.mjs

      - name: Run audio fast lane once
        id: audio_run
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: audioWorkerOnce
        run: |
          output="$(node scripts/call-apps-script-admin.mjs)"
          printf '%s\n' "$output"
          remaining="$(printf '%s' "$output" | node -e 'let s=""; process.stdin.on("data",d=>s+=d); process.stdin.on("end",()=>{const x=JSON.parse(s); console.log(Number(x.result.result.audioQueueRemaining||0));});')"
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"

      - name: Finish audio-lane task
        if: success() && steps.audio_run.outputs.remaining == '0'
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: taskUpsert
          CAREER_OS_ADMIN_PARAMS_JSON: >-
            {"task":{"task_id":"acceptance:qpl-l1:audio","parent_id":"acceptance:qpl-l1","depends_on":["acceptance:qpl-l1:ingest"],"title":"Process QPL L1 audio fast lane","executor":"apps-script:audio","stage":"fast_lane:audio","status":"DONE","current_action":"L1 transcript completed","waiting_for":[],"result_or_error":"audioQueueRemaining=0"}}
        run: node scripts/call-apps-script-admin.mjs

      - name: Keep audio-lane task waiting
        if: success() && steps.audio_run.outputs.remaining != '0'
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: taskUpsert
          CAREER_OS_ADMIN_PARAMS_JSON: >-
            {"task":{"task_id":"acceptance:qpl-l1:audio","parent_id":"acceptance:qpl-l1","depends_on":["acceptance:qpl-l1:ingest"],"title":"Process QPL L1 audio fast lane","executor":"apps-script:audio","stage":"fast_lane:audio","status":"WAITING","current_action":"Transcript is not complete yet","waiting_for":["next audio worker invocation"],"result_or_error":"audioQueueRemaining=${{ steps.audio_run.outputs.remaining }}"}}
        run: node scripts/call-apps-script-admin.mjs

      - name: Mark audio-lane failure
        if: failure()
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: taskUpsert
          CAREER_OS_ADMIN_PARAMS_JSON: >-
            {"task":{"task_id":"acceptance:qpl-l1:audio","parent_id":"acceptance:qpl-l1","title":"Process QPL L1 audio fast lane","executor":"apps-script:audio","stage":"fast_lane:audio","status":"FAILED","current_action":"Audio lane failed","result_or_error":"Inspect GitHub Actions logs"}}
        run: node scripts/call-apps-script-admin.mjs

  inspect:
    needs:
      - prepare
      - image_lane
      - audio_lane
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: career-os-staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve staging admin URL
        run: |
          deployment_id="$(tr -d '\r\n' < config/apps-script-admin-deployment-id.txt)"
          echo "CAREER_OS_ADMIN_URL=https://script.google.com/macros/s/$deployment_id/exec" >> "$GITHUB_ENV"

      - name: Publish inspect task
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: taskUpsert
          CAREER_OS_ADMIN_PARAMS_JSON: >-
            {"task":{"task_id":"acceptance:qpl-l1:inspect","parent_id":"acceptance:qpl-l1","depends_on":["acceptance:qpl-l1:image","acceptance:qpl-l1:audio"],"title":"Inspect QPL L1 fast-lane results","executor":"github-actions","stage":"acceptance:inspect","status":"RUNNING","current_action":"Read queue, source and workspace state"}}
        run: node scripts/call-apps-script-admin.mjs

      - name: Queue state after parallel lanes
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: health
        run: node scripts/call-apps-script-admin.mjs

      - name: Source status after parallel lanes
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: sourceStatus
        run: node scripts/call-apps-script-admin.mjs

      - name: Workspace inventory after parallel lanes
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: workspaceInventory
        run: node scripts/call-apps-script-admin.mjs

      - name: Task ledger after parallel lanes
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: taskSnapshot
        run: node scripts/call-apps-script-admin.mjs

      - name: Finish acceptance tasks
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: taskUpsert
          CAREER_OS_ADMIN_PARAMS_JSON: >-
            {"task":{"task_id":"acceptance:qpl-l1:inspect","parent_id":"acceptance:qpl-l1","title":"Inspect QPL L1 fast-lane results","executor":"github-actions","stage":"acceptance:inspect","status":"DONE","current_action":"Inspection completed","result_or_error":"Queue, source, workspace and task-ledger state captured"}}
        run: node scripts/call-apps-script-admin.mjs

      - name: Finish root acceptance task
        if: needs.image_lane.outputs.remaining == '0' && needs.audio_lane.outputs.remaining == '0'
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: taskUpsert
          CAREER_OS_ADMIN_PARAMS_JSON: >-
            {"task":{"task_id":"acceptance:qpl-l1","title":"QPL L1 real fast-lane acceptance","executor":"github-actions","stage":"acceptance","status":"DONE","current_action":"Fast-lane acceptance completed","waiting_for":[],"result_or_error":"Both image and audio queues reached zero"}}
        run: node scripts/call-apps-script-admin.mjs

      - name: Keep root acceptance waiting
        if: needs.image_lane.outputs.remaining != '0' || needs.audio_lane.outputs.remaining != '0'
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: taskUpsert
          CAREER_OS_ADMIN_PARAMS_JSON: >-
            {"task":{"task_id":"acceptance:qpl-l1","title":"QPL L1 real fast-lane acceptance","executor":"github-actions","stage":"acceptance","status":"WAITING","current_action":"Fast-lane work remains","waiting_for":["acceptance:qpl-l1:image","acceptance:qpl-l1:audio"],"result_or_error":"imageQueueRemaining=${{ needs.image_lane.outputs.remaining }}, audioQueueRemaining=${{ needs.audio_lane.outputs.remaining }}"}}
        run: node scripts/call-apps-script-admin.mjs
