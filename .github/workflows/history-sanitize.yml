name: One-time public history sanitization

on:
  push:
    branches:
      - maintenance/history-sanitize-2026-10-01
    paths:
      - '.github/workflows/history-sanitize.yml'

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: maintenance/history-sanitize-2026-10-01

      - name: Fetch every public branch and tag
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags --force --prune

      - name: Record pre-rewrite refs
        run: |
          set -euo pipefail
          git for-each-ref --sort=refname --format='%(refname) %(objectname)' refs/remotes/origin refs/tags > pre-rewrite-refs.txt
          cat pre-rewrite-refs.txt

      - name: Materialize remote branches locally
        run: |
          set -euo pipefail
          while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            [ "$branch" = "HEAD" ] && continue
            [ "$branch" = "maintenance/history-sanitize-2026-10-01" ] && continue
            git branch -f "$branch" "refs/remotes/origin/$branch"
          done < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | sort)

      - name: Rewrite historical workflow content
        env:
          FILTER_BRANCH_SQUELCH_WARNING: '1'
        run: |
          set -euo pipefail
          git filter-branch --force --prune-empty --tree-filter '
            target=".github/workflows/private-dashboard-deploy.yml"
            if [ -f "$target" ]; then
              perl -0pi -e '"'"'s/\b[0-9]+\+[A-Za-z0-9_-]+\@users\.noreply\.github\.com\b/career-os-bot\@users.noreply.github.com/g'"'"' "$target"
            fi
          ' -- --branches --tags
          git for-each-ref --format='delete %(refname)' refs/original | git update-ref --stdin || true

      - name: Verify rewritten tips preserve current trees
        run: |
          set -euo pipefail
          git diff --exit-code refs/remotes/origin/vnext refs/heads/vnext
          git diff --exit-code refs/remotes/origin/work/portfolio-stabilization-2026-10-01 refs/heads/work/portfolio-stabilization-2026-10-01

      - name: Verify sensitive historical pattern is absent
        run: |
          set -euo pipefail
          if git log --branches --tags -p --format= --no-ext-diff --no-color | grep -E '[0-9]+\+[A-Za-z0-9_-]+@users\.noreply\.github\.com'; then
            echo 'Historical email pattern still present after rewrite.' >&2
            exit 1
          fi

      - name: Verify deployment workflows remain manual-only
        run: |
          set -euo pipefail
          for branch in vnext work/portfolio-stabilization-2026-10-01; do
            for file in               .github/workflows/apps-script-runtime-deploy.yml               .github/workflows/private-dashboard-deploy.yml               .github/workflows/audio-proxy-deploy.yml; do
              git show "$branch:$file" | grep -q 'workflow_dispatch'
              if git show "$branch:$file" | grep -qE '^  push:'; then
                echo "$branch:$file unexpectedly has a push trigger" >&2
                exit 1
              fi
            done
          done

      - name: Validate rewritten vnext
        run: |
          set -euo pipefail
          git switch vnext
          npm test
          npm run check:privacy
          npm run check:config
          npm run check:architecture
          npm run build:apps-script
          node scripts/check-built-apps-script.mjs

      - name: Validate rewritten portfolio branch
        run: |
          set -euo pipefail
          git switch work/portfolio-stabilization-2026-10-01
          npm test
          npm run check:privacy

      - name: Force-push sanitized branch history
        run: |
          set -euo pipefail
          git push origin --force --all
          git push origin --force --tags

      - name: Record success marker
        run: |
          set -euo pipefail
          git switch maintenance/history-sanitize-2026-10-01
          mkdir -p docs/maintenance
          {
            echo '# History sanitization result'
            echo
            echo 'Status: SUCCESS'
            echo
            echo 'The historical public workflow content was rewritten with a generic bot identity.'
            echo 'Current branch trees were verified unchanged apart from the already-approved deployment gating.'
            echo 'Tests and public-tree privacy checks passed before the rewritten refs were pushed.'
          } > docs/maintenance/HISTORY_SANITIZATION_RESULT.md
          git config user.name 'career-os-maintenance'
          git config user.email 'career-os-maintenance@users.noreply.github.com'
          git add docs/maintenance/HISTORY_SANITIZATION_RESULT.md
          git commit -m 'Record successful history sanitization'
          git push origin maintenance/history-sanitize-2026-10-01
