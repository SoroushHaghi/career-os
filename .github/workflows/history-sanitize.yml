name: Finalize public history privacy cleanup

on:
  push:
    branches:
      - maintenance/history-sanitize-2026-10-01
    paths:
      - '.github/workflows/history-sanitize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: maintenance/history-sanitize-2026-10-01

      - name: Fetch public refs
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags --force --prune

      - name: Validate sanitized vNext
        run: |
          set -euo pipefail
          git switch --detach origin/vnext
          npm test
          npm run check:privacy
          npm run check:config
          npm run check:architecture
          npm run build:apps-script
          node scripts/check-built-apps-script.mjs

      - name: Validate portfolio stabilization branch
        run: |
          set -euo pipefail
          git switch --detach origin/work/portfolio-stabilization-2026-10-01
          npm test
          npm run check:privacy

      - name: Retire stale public branches
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --force --prune
          git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | sort > /tmp/branches-before.txt
          cat /tmp/branches-before.txt

          while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            [ "$branch" = "HEAD" ] && continue
            case "$branch" in
              main)
                continue
                ;;
              vnext)
                continue
                ;;
              work/portfolio-stabilization-2026-10-01)
                continue
                ;;
              maintenance/history-sanitize-2026-10-01)
                continue
                ;;
            esac
            git push origin --delete "$branch"
          done < /tmp/branches-before.txt

      - name: Verify final public branch set
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags --force --prune
          git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -v '^HEAD$' | sort > /tmp/actual-branches.txt
          printf '%s\n'             main             maintenance/history-sanitize-2026-10-01             vnext             work/portfolio-stabilization-2026-10-01             > /tmp/expected-branches.txt
          diff -u /tmp/expected-branches.txt /tmp/actual-branches.txt

      - name: Verify public branch history privacy
        run: |
          set -euo pipefail
          git log --remotes=origin --tags -p --format= --no-ext-diff --no-color > /tmp/public-history.patch
          if grep -E '[0-9]+\+[A-Za-z0-9_-]+@users\.noreply\.github\.com' /tmp/public-history.patch; then
            echo 'Historical account-specific noreply address remains reachable from a public branch/tag.' >&2
            exit 1
          fi

      - name: Record cleanup success
        run: |
          set -euo pipefail
          git switch maintenance/history-sanitize-2026-10-01
          mkdir -p docs/maintenance
          printf '%s\n'             '# History sanitization result'             ''             'Status: SUCCESS'             ''             'Active public branch histories were sanitized and validated.'             'Stale merged, diagnostic, and superseded branches were retired after a private recovery map was captured.'             'Production deployment remains disabled/manual-only.'             > docs/maintenance/HISTORY_SANITIZATION_RESULT.md
          git config user.name 'career-os-maintenance'
          git config user.email 'career-os-maintenance@users.noreply.github.com'
          git add docs/maintenance/HISTORY_SANITIZATION_RESULT.md
          git commit -m 'Record successful history privacy cleanup'
          git push origin maintenance/history-sanitize-2026-10-01
