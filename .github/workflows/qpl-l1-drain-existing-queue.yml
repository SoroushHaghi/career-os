name: QPL L1 Drain Existing Staging Queue

on:
  push:
    branches:
      - vnext
    paths:
      - '.github/workflows/qpl-l1-drain-existing-queue.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: career-os-staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve staging admin URL
        run: |
          deployment_id="$(tr -d '\r\n' < config/apps-script-admin-deployment-id.txt)"
          test -n "$deployment_id"
          echo "CAREER_OS_ADMIN_URL=https://script.google.com/macros/s/$deployment_id/exec" >> "$GITHUB_ENV"

      - name: Drain existing QPL L1 staging queues
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
        run: |
          set -euo pipefail

          call_action() {
            local action="$1"
            CAREER_OS_ADMIN_ACTION="$action" node scripts/call-apps-script-admin.mjs
          }

          parse_state() {
            local health_file="$1"
            local source_file="$2"
            local inventory_file="$3"
            node - "$health_file" "$source_file" "$inventory_file" <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const source = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          const inventory = JSON.parse(fs.readFileSync(process.argv[4], 'utf8'));

          const hr = health.result || {};
          const queues = hr.queues || {};
          const audioQueue = Array.isArray(queues.audio) ? queues.audio : [];
          const imageQueue = Array.isArray(queues.image) ? queues.image : [];

          const sr0 = source.result || {};
          const sr = sr0.result || sr0;
          const sources = Array.isArray(sr.sources) ? sr.sources : [];
          const audioSource = sources.find(x => /^audio\//i.test(String(x.mimeType || ''))) || {};

          const ir0 = inventory.result || {};
          const ir = ir0.result || ir0;

          const aq = audioQueue[0] || {};
          const queueAudioStatus = String(aq.status || '');
          const sourceAudioStatus = String(audioSource.audioStatus || '');
          const audioStatus = queueAudioStatus || sourceAudioStatus || (audioQueue.length ? 'QUEUED' : 'DONE');
          const chunkIndex = Number(aq.groqChunkIndex || 0);

          const errors = [];
          if (aq.lastError) errors.push(String(aq.lastError));
          if (audioSource.audioLastError) errors.push(String(audioSource.audioLastError));
          for (const job of imageQueue) {
            if (job && job.lastError) {
              errors.push(String(job.lastError));
              break;
            }
          }
          for (const s of sources) {
            if (s && s.imageLastError) {
              errors.push(String(s.imageLastError));
              break;
            }
          }

          const out = {
            imageRemaining: Number(queues.imageCount ?? imageQueue.length ?? 0),
            audioRemaining: audioQueue.length,
            audioStatus,
            chunkIndex,
            lastError: errors.find(Boolean) || '',
            artifactCount: Number(ir.artifactCount || 0)
          };
          process.stdout.write(JSON.stringify(out));
          NODE
          }

          snapshot() {
            local prefix="$1"
            call_action health > "${prefix}.health.json"
            call_action sourceStatus > "${prefix}.source.json"
            call_action workspaceInventory > "${prefix}.inventory.json"
            parse_state "${prefix}.health.json" "${prefix}.source.json" "${prefix}.inventory.json"
          }

          mkdir -p /tmp/qpl-drain

          initial="$(snapshot /tmp/qpl-drain/initial)"
          prev_image="$(node -e 'const x=JSON.parse(process.argv[1]); console.log(x.imageRemaining)' "$initial")"
          prev_status="$(node -e 'const x=JSON.parse(process.argv[1]); console.log(x.audioStatus)' "$initial")"
          prev_chunk="$(node -e 'const x=JSON.parse(process.argv[1]); console.log(x.chunkIndex)' "$initial")"
          prev_artifacts="$(node -e 'const x=JSON.parse(process.argv[1]); console.log(x.artifactCount)' "$initial")"
          no_progress=0

          for cycle in $(seq 1 50); do
            set +e
            CAREER_OS_ADMIN_ACTION=imageWorkerOnce node scripts/call-apps-script-admin.mjs               > "/tmp/qpl-drain/cycle-${cycle}.image.json" 2> "/tmp/qpl-drain/cycle-${cycle}.image.err" &
            image_pid=$!

            CAREER_OS_ADMIN_ACTION=audioWorkerOnce node scripts/call-apps-script-admin.mjs               > "/tmp/qpl-drain/cycle-${cycle}.audio.json" 2> "/tmp/qpl-drain/cycle-${cycle}.audio.err" &
            audio_pid=$!

            wait "$image_pid"
            image_rc=$?
            wait "$audio_pid"
            audio_rc=$?
            set -e

            state="$(snapshot "/tmp/qpl-drain/cycle-${cycle}")"
            image_remaining="$(node -e 'const x=JSON.parse(process.argv[1]); console.log(x.imageRemaining)' "$state")"
            audio_remaining="$(node -e 'const x=JSON.parse(process.argv[1]); console.log(x.audioRemaining)' "$state")"
            audio_status="$(node -e 'const x=JSON.parse(process.argv[1]); console.log(x.audioStatus)' "$state")"
            chunk_index="$(node -e 'const x=JSON.parse(process.argv[1]); console.log(x.chunkIndex)' "$state")"
            last_error="$(node -e 'const x=JSON.parse(process.argv[1]); console.log(x.lastError)' "$state")"
            artifact_count="$(node -e 'const x=JSON.parse(process.argv[1]); console.log(x.artifactCount)' "$state")"
            new_artifacts=$((artifact_count - prev_artifacts))

            echo "CYCLE ${cycle} | image remaining=${image_remaining} | audio status=${audio_status} | chunk index=${chunk_index} | lastError=${last_error:-none} | new artifacts=${new_artifacts}"

            if [ "$image_rc" -ne 0 ] || [ "$audio_rc" -ne 0 ]; then
              echo "STOP_ERROR: lane invocation failed | image_rc=${image_rc} | audio_rc=${audio_rc}"
              if [ "$image_rc" -ne 0 ]; then
                tail -n 20 "/tmp/qpl-drain/cycle-${cycle}.image.err" || true
              fi
              if [ "$audio_rc" -ne 0 ]; then
                tail -n 20 "/tmp/qpl-drain/cycle-${cycle}.audio.err" || true
              fi
              exit 1
            fi

            if [ -n "$last_error" ]; then
              echo "STOP_ERROR: ${last_error}"
              exit 1
            fi

            if [ "$image_remaining" -eq 0 ] && [ "$audio_remaining" -eq 0 ]; then
              echo "DRAIN_COMPLETE: imageQueue=0 audioQueue=0"
              exit 0
            fi

            progressed=0
            if [ "$image_remaining" -lt "$prev_image" ]; then progressed=1; fi
            if [ "$chunk_index" -gt "$prev_chunk" ]; then progressed=1; fi
            if [ "$audio_status" != "$prev_status" ]; then progressed=1; fi
            if [ "$artifact_count" -gt "$prev_artifacts" ]; then progressed=1; fi

            if [ "$progressed" -eq 1 ]; then
              no_progress=0
            else
              no_progress=$((no_progress + 1))
            fi

            if [ "$no_progress" -ge 2 ]; then
              echo "STOP_NO_PROGRESS: two consecutive cycles without queue/status/chunk/artifact progress"
              exit 2
            fi

            prev_image="$image_remaining"
            prev_status="$audio_status"
            prev_chunk="$chunk_index"
            prev_artifacts="$artifact_count"
          done

          echo "STOP_ERROR: 50-cycle safety cap reached before both queues drained"
          exit 3

      - name: Report deferred video sources
        if: always()
        env:
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
          CAREER_OS_ADMIN_ACTION: folderIngest
        run: |
          echo "VIDEO_DEFERRED sources remain intentionally outside this drain:"
          echo "- ScreenRecording_09-26-2026 15-48-32_1.MP4"
          echo "- ScreenRecording_09-26-2026 16-08-57_1.MP4"
          echo "- ScreenRecording_09-26-2026 16-37-52_1.MP4"
          echo "No video processing was invoked."
