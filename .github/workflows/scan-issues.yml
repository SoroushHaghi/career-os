name: Privacy scan of issues and comments
# Layer 3 for anything posted directly to this repo: pattern scan (no private denylist here).
# On a hit the post is labelled needs-review and locked; the maintainer edits or deletes it.
on:
  issues: {types: [opened, edited]}
  issue_comment: {types: [created, edited]}
permissions:
  issues: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: tools}
      - name: Scan
        env:
          TEXT: ${{ github.event.comment.body || format('{0}\n{1}', github.event.issue.title, github.event.issue.body) }}
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          if printf '%s' "$TEXT" | python3 tools/privacy_check.py -; then exit 0; fi
          gh label create needs-review --color b60205 --description "Possible personal data — hidden for review" -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh issue edit "$NUM" --add-label needs-review -R "$GITHUB_REPOSITORY"
          gh issue lock "$NUM" -R "$GITHUB_REPOSITORY" || true
