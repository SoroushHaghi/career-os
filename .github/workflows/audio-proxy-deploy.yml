name: Audio Proxy Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: career-os-staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate worker source
        run: node --check apps/audio-proxy-worker/src/index.js

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy staging audio proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config apps/audio-proxy-worker/wrangler.jsonc

      - name: Configure worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CAREER_OS_PROXY_SHARED_SECRET: ${{ secrets.CAREER_OS_PROXY_SHARED_SECRET }}
        run: |
          test -n "$CAREER_OS_PROXY_SHARED_SECRET"
          printf '%s' "$CAREER_OS_PROXY_SHARED_SECRET" | npx --yes wrangler@latest secret put CAREER_OS_PROXY_SHARED_SECRET --config apps/audio-proxy-worker/wrangler.jsonc

      - name: Verify staging proxy health
        env:
          AUDIO_PROXY_HEALTH_URL: ${{ secrets.AUDIO_PROXY_HEALTH_URL }}
        run: |
          test -n "$AUDIO_PROXY_HEALTH_URL"
          response="$(curl --fail --silent --show-error "$AUDIO_PROXY_HEALTH_URL")"
          printf '%s\n' "$response"
          printf '%s' "$response" | grep -q '"ok":true'
