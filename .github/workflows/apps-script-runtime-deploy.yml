name: Apps Script Runtime Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target/profile
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  deploy-staging:
    if: ${{ inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    environment: career-os-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test
        run: npm test
      - name: Validate repository
        run: |
          node scripts/validate-config.mjs
          node scripts/validate-vnext-architecture.mjs
          node scripts/privacy-check.mjs
          node scripts/check-modular-apps-script-source.mjs
          node scripts/check-apps-script-function-uniqueness.mjs
      - name: Build staging runtime
        env:
          CAREER_OS_BUILD_PROFILE: staging
          CAREER_OS_BUILD_CHANNEL: staging
          CAREER_OS_BUILD_VERSION: vnext-staging
        run: npm run build:apps-script
      - name: Validate staging runtime
        env:
          CAREER_OS_BUILD_PROFILE: staging
        run: node scripts/check-apps-script-package.mjs
      - name: Require deployment credentials
        env:
          APPS_SCRIPT_PROJECT_ID: ${{ secrets.APPS_SCRIPT_PROJECT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$APPS_SCRIPT_PROJECT_ID"
          test -n "$CLASPRC_JSON"
      - name: Install clasp
        run: npm install --global @google/clasp
      - name: Configure clasp
        env:
          APPS_SCRIPT_PROJECT_ID: ${{ secrets.APPS_SCRIPT_PROJECT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          node -e "const fs=require('fs'); fs.writeFileSync('.clasp.json', JSON.stringify({scriptId:process.env.APPS_SCRIPT_PROJECT_ID,rootDir:'apps/apps-script-runtime/dist/staging'},null,2))"
      - name: Deploy generated staging runtime
        run: clasp push --force
      - name: Clean credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json" .clasp.json

  deploy-production:
    if: ${{ inputs.target == 'production' }}
    runs-on: ubuntu-latest
    environment: career-os-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test
        run: npm test
      - name: Validate repository
        run: |
          node scripts/validate-config.mjs
          node scripts/validate-vnext-architecture.mjs
          node scripts/privacy-check.mjs
          node scripts/check-modular-apps-script-source.mjs
          node scripts/check-apps-script-function-uniqueness.mjs
      - name: Build production runtime
        env:
          CAREER_OS_BUILD_PROFILE: production
          CAREER_OS_BUILD_CHANNEL: production
          CAREER_OS_BUILD_VERSION: vnext-production
        run: npm run build:apps-script
      - name: Validate production runtime
        env:
          CAREER_OS_BUILD_PROFILE: production
        run: node scripts/check-apps-script-package.mjs
      - name: Require deployment credentials
        env:
          APPS_SCRIPT_PROJECT_ID: ${{ secrets.APPS_SCRIPT_PROJECT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$APPS_SCRIPT_PROJECT_ID"
          test -n "$CLASPRC_JSON"
      - name: Install clasp
        run: npm install --global @google/clasp
      - name: Configure clasp
        env:
          APPS_SCRIPT_PROJECT_ID: ${{ secrets.APPS_SCRIPT_PROJECT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          node -e "const fs=require('fs'); fs.writeFileSync('.clasp.json', JSON.stringify({scriptId:process.env.APPS_SCRIPT_PROJECT_ID,rootDir:'apps/apps-script-runtime/dist/production'},null,2))"
      - name: Deploy generated production runtime
        run: clasp push --force
      - name: Clean credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json" .clasp.json