name: Workflow failure to issue
# Turns every failed automation run into one open issue, so failures are tracked where all problems are
# tracked (and GitHub's failure e-mails can be switched off). Same failure again = a comment, not a new issue.
on:
  workflow_run:
    workflows: ["Release RULES.md version", "Privacy scan of issues and comments", "Publish release to the public repo (privacy-gated)", "RULES.md change check"]
    types: [completed]
permissions:
  issues: write
  actions: read
jobs:
  record:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ github.event.workflow_run.name }}
          URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          title="Automation failed: $NAME"
          body="$(date -u +%F' '%H:%M) UTC — run $URL (commit ${SHA:0:7})."
          num=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title -q ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ -n "$num" ]; then gh issue comment "$num" -R "$GITHUB_REPOSITORY" --body "Failed again: $body"
          else gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body Close this issue when fixed." --label "kind: bug"; fi
